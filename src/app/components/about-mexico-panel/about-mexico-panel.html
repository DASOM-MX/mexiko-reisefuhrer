<div class="w-full grid grid-cols-2">
  <!-- Top Left: Headline -->
  <div
    class="w-full aspect-square flex items-center justify-center text-center bg-gradient-to-br from-amber-50 to-orange-50"
  >
    <div class="px-12">
      <h2
        class="font-playfair text-6xl font-bold text-gray-900 leading-tight mb-4"
      >
        Erleben Sie <span class="text-amber-600">Mexiko</span>
      </h2>
      <p class="font-lora text-2xl text-gray-700 leading-relaxed">
        Kultur, Geschichte und Lebensfreude vereint
      </p>
    </div>
  </div>

  <!-- Top Right: Image -->
  <div
    class="w-full aspect-square flex items-center justify-center overflow-hidden"
  >
    <img
      src="sonne-piramide-1.jpeg"
      alt="Mexikanische Pyramiden"
      class="w-full h-full object-cover hover:scale-105 transition-transform duration-700"
    />
  </div>

  <!-- Bottom Left: Image -->
  <div
    class="w-full aspect-square flex items-center justify-center overflow-hidden"
  >
    <img
      src="sonne-piramide-2.jpeg"
      alt="Teotihuacán Ruinen"
      class="w-full h-full object-cover hover:scale-105 transition-transform duration-700"
    />
  </div>

  <!-- Bottom Right: Dynamic Text -->
  <div
    class="w-full aspect-square flex items-center justify-center text-center bg-gradient-to-br from-slate-50 to-zinc-50"
  >
    <div class="flex flex-col gap-y-6 items-center justify-center px-8">
      <p
        class="font-playfair text-5xl font-semibold text-gray-800 leading-tight"
      >
        Von
      </p>
      @for (city of [currentCity()]; track city) {
        <span class="label-box">
          {{ city }}
        </span>
      }
      <p
        class="font-playfair text-5xl font-semibold text-gray-800 leading-tight"
      >
        nach
      </p>
      @for (destination of [currentDestination()]; track destination) {
        <span class="label-box label-box-dark">
          {{ destination }}!
        </span>
      }
    </div>
  </div>
</div>
