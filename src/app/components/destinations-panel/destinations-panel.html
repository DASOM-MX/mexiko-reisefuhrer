<div class="w-full h-fit pt-20 flex flex-col items-center font-playfair">
  <h1 class="text-6xl font-bold text-center">Ihre Reiseziele</h1>
  <p class="text-center text-2xl text-gray-700 leading-relaxed">
    Wir haben die schönsten Destinationen für Sie ausgewählt
  </p>

  <!-- PrimeNG Carousel -->
  <div class="w-full h-fit">
    <p-carousel
      [value]="destinations"
      [numVisible]="1"
      [numScroll]="1"
      [circular]="true"
      [autoplayInterval]="20000"
      [showIndicators]="true"
      [showNavigators]="false"
      class="size-full"
    >
      <ng-template let-destination pTemplate="item">
        <div class="flex flex-col w-full h-full py-10">
          <div
            class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center"
          >
            <div class="flex flex-col gap-y-6 px-16 py-8">
              <h3
                class="font-playfair text-4xl md:text-5xl font-bold text-gray-900"
              >
                {{ destination.title }}
              </h3>
              <p class="font-lora text-lg text-gray-700 leading-relaxed">
                {{ destination.description }}
              </p>
              <button
                (click)="handleNavigateToForm()"
                class="font-montserrat bg-amber-strong-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-amber-strong-700 transition-colors duration-300 shadow-fancy-amber"
              >
                Mehr erfahren
              </button>
            </div>
            <div class="w-full aspect-video overflow-hidden">
              <img [src]="destination.mainImage" [alt]="destination.title" class="size-full object-cover">
            </div>
          </div>
          <!-- Right: Polaroid Grid -->
          <div class="flex flex-row flex-1">
            @for (image of destination.images; track image) {
            <div class="w-full max-h-full overflow-hidden">
              <img
                [src]="image"
                [alt]="destination.title"
                class="w-full h-full object-cover"
                loading="lazy"
              />
            </div>

            }
          </div>
        </div>
      </ng-template>
    </p-carousel>
  </div>
</div>
